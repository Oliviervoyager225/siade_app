definitions:
  env_versions: &env_versions
    flutter: stable
    xcode: latest
    cocoapods: default

workflows:
  ios-screenshots:
    name: iOS - captures App Store
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      <<: *env_versions
      # SCREENSHOT_EMAIL et SCREENSHOT_PASSWORD (identifiants d'un compte de
      # test) proviennent du groupe de variables Codemagic `screenshots`.
      # Sans eux, seuls les écrans d'accueil et de connexion sont capturés.
      groups:
        - screenshots
    scripts:
      - name: Dépendances
        script: flutter pub get

      - name: Démarrer un simulateur grand format
        script: |
          set -e
          # On vise le plus grand iPhone disponible : sa capture est ensuite
          # ramenée à 1284 × 2778, l'un des deux formats acceptés par Apple
          # pour l'emplacement 6,5". La liste des modèles change à chaque
          # version de Xcode, d'où le repli sur n'importe quel iPhone.
          UDID=""
          trouver() {
            xcrun simctl list devices available \
              | grep -m1 "^ *$1 (" \
              | grep -oE '[0-9A-F-]{36}' || true
          }
          for MODELE in "iPhone 17 Pro Max" "iPhone 16 Pro Max" "iPhone 15 Pro Max" \
                        "iPhone 14 Plus" "iPhone 11 Pro Max"; do
            UDID=$(trouver "$MODELE")
            if [ -n "$UDID" ]; then
              echo "Simulateur retenu : $MODELE ($UDID)"
              break
            fi
          done
          if [ -z "$UDID" ]; then
            LIGNE=$(xcrun simctl list devices available | grep -m1 "^ *iPhone " || true)
            UDID=$(echo "$LIGNE" | grep -oE '[0-9A-F-]{36}' || true)
            [ -n "$UDID" ] && echo "Repli sur :$(echo "$LIGNE" | sed 's/(.*//')"
          fi
          if [ -z "$UDID" ]; then
            echo "Aucun simulateur iPhone disponible :" >&2
            xcrun simctl list devices available >&2
            exit 1
          fi
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          echo "SIM_UDID=$UDID" >> $CM_ENV

      - name: Générer les captures
        script: |
          set -e
          flutter drive \
            --driver=test_driver/integration_test.dart \
            --target=integration_test/screenshots_test.dart \
            -d "$SIM_UDID" \
            --dart-define=SCREENSHOT_EMAIL="$SCREENSHOT_EMAIL" \
            --dart-define=SCREENSHOT_PASSWORD="$SCREENSHOT_PASSWORD"

      - name: Normaliser au format App Store
        script: |
          set -e
          if [ -z "$(ls -A screenshots 2>/dev/null)" ]; then
            echo "Aucune capture produite." >&2
            exit 1
          fi
          # Apple refuse tout écart d'un seul pixel : on force la taille exacte.
          for f in screenshots/*.png; do
            sips --resampleHeightWidth 2778 1284 "$f" >/dev/null
            echo "$f -> $(sips -g pixelWidth -g pixelHeight "$f" | tail -2 | tr -d ' \n')"
          done
    artifacts:
      - screenshots/*.png
    publishing:
      email:
        recipients:
          - olivier.dakouri25@gmail.com
        notify:
          success: true
          failure: true

  ios-release:
    name: iOS - build et publication App Store
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      # Clé enregistrée dans Codemagic > Settings > Integrations >
      # Developer Portal (Key ID W9FQY89LCJ). Codemagic résout le Key ID et
      # la clé privée à partir de ce nom.
      app_store_connect: Codemagic2026
    environment:
      <<: *env_versions
      vars:
        BUNDLE_ID: com.sahanalytics.siadeapp
      # CERTIFICATE_PRIVATE_KEY : clé RSA privée du certificat de distribution,
      # dans le groupe de variables Codemagic `signing`.
      groups:
        - signing
    scripts:
      - name: Dépendances
        script: flutter pub get

      - name: Certificat et profil de signature
        script: |
          set -e
          # Le bloc déclaratif `ios_signing` ne fait que récupérer un profil
          # existant : il échoue tant qu'aucun profil App Store n'a été créé
          # pour ce bundle. `--create` le génère au besoin, ainsi que le
          # certificat de distribution — mais un certificat ne vaut rien sans
          # sa clé privée, d'où `--certificate-key`.
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key="@env:CERTIFICATE_PRIVATE_KEY" \
            --create
          keychain add-certificates
          xcode-project use-profiles

      - name: Build IPA
        script: |
          set -e
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
      email:
        recipients:
          - olivier.dakouri25@gmail.com
        notify:
          success: true
          failure: true
