name: siade2
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.1+3

environment:
  sdk: ^3.8.1


dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  gap:
  sizer:
  flutter_svg:
  carousel_slider:
  intl:
  go_router:
  flutter_staggered_grid_view:
  video_player:
  google_maps_flutter:
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  http: ^1.2.0
  dio: ^5.4.1
  flutter_secure_storage: ^9.0.0
  sqflite: ^2.3.2
  path: ^1.9.0
  connectivity_plus: ^6.0.3
  crypto: ^3.0.3

  # Agora Live Streaming
  agora_rtc_engine: ^6.3.2
  permission_handler: ^11.3.0

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.3
  firebase_storage: ^12.3.4
  google_sign_in: ^6.2.2
  cloud_functions: ^5.1.3
  firebase_messaging: ^15.1.3
  firebase_crashlytics: ^4.1.3

  # Cache Management & Image Optimization
  cached_network_image: ^3.3.1
  flutter_cache_manager: ^3.3.1
  image_picker: ^1.0.7
  url_launcher: ^6.3.0
  workmanager: ^0.9.0
  
  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  flutter_native_splash: ^2.4.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_gen_runner:
  build_runner:
  flutter_launcher_icons: ^0.14.2

  flutter_lints: ^5.0.0

# The following section is specific to Flutter packages.
flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/images/
    - assets/videos/video.mp4

flutter_native_splash:
  color: "#040126"
  color_dark: "#040126"
  image: assets/images/sahanalytics.png
  image_dark: assets/images/sahanalytics.png
  android_gravity: center
  ios_content_mode: center

  android_12:
    color: "#040126"
    color_dark: "#2E8AF6"
    image: assets/images/sahanalytics.png
    image_dark: assets/images/sahanalytics.png
    android_gravity: center

  android: true
  ios: true
  fullscreen: true
  web: false

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/sahanalytics.png"
  image_path_ios: "assets/images/sahanalytics_ios.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/sahanalytics.png"


flutter_gen:
  output: lib/gen/
  integrations:
    flutter_svg: true
